name: Feature request
description: Suggest an improvement for the pctx0 client
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to change or add?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, API areas, or examples that help (optional)
    validations:
      required: false
